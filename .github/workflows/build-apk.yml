          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          ls -lh app/release.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Sherpa-ONNX Android AAR
        run: |
          mkdir -p app/libs
          curl -L -f -o app/libs/sherpa-onnx-2.0.3.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.3/sherpa-onnx-2.0.3.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk QingErTranscriber-v1.3.1.apk
          ls -lh QingErTranscriber-v1.3.1.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: 轻耳 v1.3.1（改名）
          body: |
            - 改名：App 正式改名为「轻耳」（原名清耳转录），桌面图标、通知、界面标题统一改名
            - 功能与 v1.3 完全一致
            - 固定发布签名不变：可直接覆盖升级 v1.3

            - 支持小宇宙单集链接、B 站视频链接（含 b23.tv）、泛用播客链接及本地音视频文件
            - 支持普通话、英语、粤语、日语、韩语自动识别并自动加标点，输出带时间戳的 Markdown 文稿
          files: QingErTranscriber-v1.3.1.apk
